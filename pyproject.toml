[project]
name = "nemetschek-ai"
version = "0.1.0"
description = "Archicad AI productivity tools (MCP server over the Tapir add-on): door fire-rating fix-up and wall cost take-off"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "openpyxl>=3.1",
]

[project.scripts]
nemetschek-ai = "nemetschek_ai.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemetschek_ai"]
